# 模型和训练超参数
model:
  name: "Qwen/Qwen2.5-VL-3B-Instruct"
  local_path: "/root/autodl-tmp/models/Qwen2.5-VL-3B-Instruct"
  dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

qlora:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: "all-linear"

# Stage-specific overrides
stages:
  sft:
    lora_r: 16
    lora_alpha: 32
    learning_rate: 2.0e-4
    batch_size: 4
    gradient_accumulation_steps: 4
    epochs: 3
    max_seq_length: 2048
    max_pixels: 1003520  # ~1M pixels per image

  dpo:
    lora_r: 16
    lora_alpha: 32
    learning_rate: 5.0e-5
    beta: 0.1
    batch_size: 2
    gradient_accumulation_steps: 8
    epochs: 2

  grpo:
    lora_r: 32
    lora_alpha: 64
    learning_rate: 1.0e-5
    num_generations: 8  # G
    max_prompt_length: 1024
    max_completion_length: 768
    beta: 0.01
    clip_range: 0.2

  agent_sft:
    lora_r: 16
    lora_alpha: 32
    learning_rate: 2.0e-4
    max_seq_length: 3072  # longer for tool interactions
    epochs: 2

  agent_grpo:
    lora_r: 32
    lora_alpha: 64
    learning_rate: 1.0e-5
    num_generations: 8
    max_prompt_length: 1024
    max_completion_length: 1536
    beta: 0.01
